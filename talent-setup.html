<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بياناتك — Studio</title>
<meta name="description" content="سجّل جملك الصوتية وسلّمها بسهولة · Record and submit voice tasks">
<meta name="theme-color" content="#0B0D10">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Studio">
<meta property="og:locale" content="ar_AR">
<meta property="og:title" content="بياناتك — Studio">
<meta property="og:description" content="سجّل جملك الصوتية وسلّمها بسهولة · Record and submit voice tasks">
<meta property="og:url" content="https://gigversestudio.click/talent-setup.html">
<meta property="og:image" content="https://gigversestudio.click/assets/og-image.png?v=1">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Studio">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="بياناتك — Studio">
<meta name="twitter:description" content="سجّل جملك الصوتية وسلّمها بسهولة · Record and submit voice tasks">
<meta name="twitter:image" content="https://gigversestudio.click/assets/og-image.png?v=1">
<link rel="stylesheet" href="css/studio.css">
<script src="js/config.js"></script>
<script src="js/studio-i18n-dict.js"></script>
<script src="js/studio-i18n.js"></script>
</head>
<body class="studio">

<header class="studio-header">
  <a href="tasks.html" style="text-decoration:none; color:inherit;"><div class="studio-logo"><span class="dot"></span> Studio</div></a>
</header>

<main class="studio-shell">
  <div class="studio-card">
    <div class="studio-eyebrow" id="step-label">خطوة 1 من 4</div>
    <h1 class="studio-title" id="task-title">جاري التحميل...</h1>

    <!-- step 1: gender -->
    <div id="tab-gender">
      <p class="studio-subtitle">اختار نوعك</p>
      <div class="studio-grid cols-2" id="gender-buttons"></div>
    </div>

    <!-- step 2: age bracket (only when the task uses age brackets) -->
    <div id="tab-age-bracket" class="hidden">
      <p class="studio-subtitle">اختار الفئة العمرية</p>
      <div class="studio-grid cols-3" id="bracket-buttons"></div>
    </div>

    <!-- step 3: fake name -->
    <div id="tab-fake-name" class="hidden">
      <p class="studio-subtitle" id="name-subtitle">اختار اسم مستعار (مش هيظهر حد تاني بيه)</p>
      <select id="fake-name-select" style="margin-bottom:14px;"></select>
      <button type="button" class="studio-btn studio-btn-primary studio-btn-block" onclick="confirmFakeName()">التالي</button>
    </div>

    <!-- step 4: age -->
    <div id="tab-age" class="hidden">
      <p class="studio-subtitle">سنّك بالظبط؟</p>
      <div class="studio-field">
        <input type="number" id="age-input" min="1" max="120" placeholder="مثال: 27">
      </div>
      <p class="studio-error" id="final-error"></p>
      <button type="button" class="studio-btn studio-btn-primary studio-btn-block" id="start-btn">🎙️ ابدأ التسجيل</button>
    </div>
  </div>
</main>

<script src="js/studio-talent.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const taskId = params.get("taskId");
  const leaderId = params.get("leaderId");
  if (!taskId) location.href = "tasks.html";          // leaderId is missing on purpose for direct tasks (checked once the task loads)
  NMTalent.requireLogin(location.pathname + location.search);

  const answers = { gender: null, ageBracket: null, fakeName: null, age: null };
  let task = null;                       // the task with its places left (slots)
  let STEPS = ["tab-gender", "tab-fake-name", "tab-age"];
  let stepIndex = 0;

  const GENDERS = [["male", "👨 ذكر"], ["female", "👩 أنثى"]];
  const BRACKETS = [["child", "🧒 طفل"], ["adult", "🧑 بالغ"], ["elderly", "🧓 مسن"]];

  // a slot = the places for one gender (and one age bracket when the task uses them)
  function slotsOf(gender, bracket) {
    if (!task || !task.limited) return null;                              // no limit on this task
    return task.slots.filter(s => s.gender === gender && (bracket === undefined || s.ageBracket === bracket));
  }
  function remaining(gender, bracket) {
    const list = slotsOf(gender, bracket);
    return list === null ? null : list.reduce((n, s) => n + (s.max === 0 ? 0 : s.remaining), 0);
  }
  function optionHtml(label, left, onclick, padding) {
    const full = left !== null && left <= 0;
    return `<button type="button" class="studio-btn studio-btn-secondary" style="padding:${padding}px;" ${full ? "disabled" : `onclick="${onclick}"`}>
      <span>${label}</span><br>
      <small>${left === null ? "" : full ? "<span>تم الاكتفاء</span>" : `<span>متبقي</span> <span dir="ltr">${left}</span>`}</small></button>`;
  }
  function renderOptions() {
    document.getElementById("gender-buttons").innerHTML = GENDERS.map(([g, label]) => optionHtml(label, remaining(g), `pick('gender','${g}')`, 22)).join("");
    document.getElementById("bracket-buttons").innerHTML = BRACKETS
      .map(([b, label]) => optionHtml(label, remaining(answers.gender, b), `pick('ageBracket','${b}')`, 18)).join("");
  }

  function showStep(i) {
    STEPS.forEach((id, idx) => document.getElementById(id).classList.toggle("hidden", idx !== i));
    document.getElementById("step-label").textContent = `خطوة ${i + 1} من ${STEPS.length}`;
  }

  function pick(field, value) {
    answers[field] = value;
    if (field === "gender") {
      answers.ageBracket = null;
      STEPS = task && task.use_age_brackets ? ["tab-gender", "tab-age-bracket", "tab-fake-name", "tab-age"] : ["tab-gender", "tab-fake-name", "tab-age"];
      renderOptions();
    }
    stepIndex++;
    if (STEPS[stepIndex] === "tab-fake-name") loadFakeNames();
    showStep(stepIndex);
  }

  async function loadFakeNames() {
    const select = document.getElementById("fake-name-select");
    select.innerHTML = `<option>جاري التحميل...</option>`;
    const useCodes = task && task.identity_mode === "codes";
    document.getElementById("name-subtitle").textContent = useCodes ? "اختار الكود بتاعك" : "اختار اسم مستعار (مش هيظهر حد تاني بيه)";
    try {
      const names = await NMTalent.getAvailableFakeNames(taskId, answers.gender);
      if (!names.length) {
        select.innerHTML = useCodes ? `<option value="">مفيش أكواد متاحة دلوقتي</option>` : `<option value="">مفيش أسامي متاحة دلوقتي</option>`;
        return;
      }
      select.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join("");
    } catch (err) {
      select.innerHTML = `<option value="">تعذر التحميل</option>`;
    }
  }

  function confirmFakeName() {
    const select = document.getElementById("fake-name-select");
    if (!select.value) return;
    answers.fakeName = select.value;
    stepIndex++;
    showStep(stepIndex);
  }

  document.getElementById("start-btn").addEventListener("click", async () => {
    const errorBox = document.getElementById("final-error");
    errorBox.style.display = "none";
    answers.age = document.getElementById("age-input").value || null;
    const btn = document.getElementById("start-btn");
    btn.disabled = true; btn.textContent = "جاري البدء...";
    try {
      const { session } = await NMTalent.createSession({
        taskId, ...(leaderId ? { leaderId } : {}),
        gender: answers.gender,
        ageBracket: answers.ageBracket,
        age: answers.age,
        fakeName: answers.fakeName,
      });
      NMTalent.saveSessionToken(taskId, session.session_token);
      location.href = `recording.html?session=${session.session_token}`;
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
      btn.disabled = false; btn.textContent = "🎙️ ابدأ التسجيل";
      if (err.message.includes("الاسم") || err.message.includes("الكود")) { stepIndex = STEPS.indexOf("tab-fake-name"); showStep(stepIndex); loadFakeNames(); }
      // somebody took the last place a second before: reload the places and start again from the first step
      if (err.message.includes("الاكتفاء") || err.message.includes("مش مطلوبين")) { refreshTask().then(() => { stepIndex = 0; showStep(0); }); }
    }
  });

  async function refreshTask() {
    try {
      const detail = await NMTalent.getTaskDetail(taskId);
      task = detail.task;
      // v4: when the task limits how many each leader brings, show the places left under THIS leader's code
      // (the task's own total still applies on the server). Tasks without it behave exactly as before.
      const mine = detail.leaderSlots && leaderId && detail.leaderSlots[leaderId];
      if (mine && mine.limited) task = { ...task, limited: true, slots: mine.slots };
      if (!task.direct && !leaderId) { location.href = "tasks.html"; return; }   // a normal task needs the leader's code
      document.getElementById("task-title").textContent = task.title;
    } catch (_) {
      document.getElementById("task-title").textContent = "بياناتك";
    }
    renderOptions();
    showStep(stepIndex);
  }

  window.pick = pick;
  window.confirmFakeName = confirmFakeName;
  refreshTask();
</script>
</body>
</html>
