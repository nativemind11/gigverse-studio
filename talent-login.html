<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابك — Studio</title>
<meta name="description" content="سجّل جملك الصوتية وسلّمها بسهولة · Record and submit voice tasks">
<meta name="theme-color" content="#0B0D10">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Studio">
<meta property="og:locale" content="ar_AR">
<meta property="og:title" content="حسابك — Studio">
<meta property="og:description" content="سجّل جملك الصوتية وسلّمها بسهولة · Record and submit voice tasks">
<meta property="og:url" content="https://gigversestudio.click/talent-login.html">
<meta property="og:image" content="https://gigversestudio.click/assets/og-image.png?v=1">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Studio">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="حسابك — Studio">
<meta name="twitter:description" content="سجّل جملك الصوتية وسلّمها بسهولة · Record and submit voice tasks">
<meta name="twitter:image" content="https://gigversestudio.click/assets/og-image.png?v=1">
<link rel="stylesheet" href="css/studio.css">
<script src="js/config.js"></script>
<script src="js/studio-i18n-dict.js"></script>
<script src="js/studio-i18n.js"></script>
</head>
<body class="studio">

<header class="studio-header">
  <a href="tasks.html" style="text-decoration:none; color:inherit;"><div class="studio-logo"><span class="dot"></span> Studio</div></a>
</header>

<main class="studio-shell">
  <div class="studio-card">
    <div class="studio-tabs" id="mode-tabs">
      <div class="studio-tab active" data-mode="login">عندي حساب</div>
      <div class="studio-tab" data-mode="signup">حساب جديد</div>
    </div>

    <!-- login -->
    <form id="login-form">
      <div class="studio-eyebrow">تسجيل الدخول</div>
      <h1 class="studio-title">أهلاً بيك تاني</h1>
      <div class="studio-field">
        <label for="l-email">البريد الإلكتروني</label>
        <input type="email" id="l-email" required>
      </div>
      <div class="studio-field">
        <label for="l-password">كلمة المرور</label>
        <input type="password" id="l-password" required>
      </div>
      <p class="text-center" style="margin:-4px 0 14px;"><a href="forgot-password.html" style="font-size:0.85rem; color:var(--studio-text-muted);">نسيت كلمة المرور؟</a></p>
      <p class="studio-error" id="login-error"></p>
      <button type="submit" class="studio-btn studio-btn-primary studio-btn-block" id="login-btn">دخول</button>
    </form>

    <!-- signup -->
    <form id="signup-form" class="hidden">
      <div class="studio-eyebrow">حساب جديد</div>
      <h1 class="studio-title">يلا نبدأ</h1>
      <p class="studio-hint" style="margin-top:0;">بياناتك دي بتتكتب مرة واحدة هنا، ومش هتتسأل عليها تاني في أي مهمة. اكتبها بالإنجليزي لأنها بتظهر في اسم الملف.</p>
      <div class="studio-field">
        <label for="s-name">اسمك الحقيقي بالإنجليزي</label>
        <input type="text" id="s-name" dir="ltr" placeholder="Ahmed Ali" autocomplete="name" required>
      </div>
      <div class="studio-grid cols-2">
        <div class="studio-field">
          <label for="s-gender">النوع</label>
          <select id="s-gender" required>
            <option value="">اختار</option>
            <option value="male">ذكر (male)</option>
            <option value="female">أنثى (female)</option>
          </select>
        </div>
        <div class="studio-field">
          <label for="s-age">السن</label>
          <input type="text" id="s-age" inputmode="numeric" dir="ltr" placeholder="27" maxlength="3" required>
        </div>
      </div>
      <p class="studio-hint" id="s-bracket" style="margin-top:-6px;"></p>
      <div class="studio-field">
        <label for="s-email">البريد الإلكتروني</label>
        <input type="email" id="s-email" required>
      </div>
      <div class="studio-field">
        <label for="s-password">كلمة المرور</label>
        <input type="password" id="s-password" minlength="6" required>
      </div>
      <p class="studio-error" id="signup-error"></p>
      <button type="submit" class="studio-btn studio-btn-primary studio-btn-block" id="signup-btn" style="margin-top:12px;">إنشاء الحساب</button>
    </form>
  </div>
</main>

<script src="js/studio-talent.js"></script>
<script>
  const returnTo = new URLSearchParams(location.search).get("return") || "tasks.html";

  document.querySelectorAll("#mode-tabs .studio-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll("#mode-tabs .studio-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      const mode = tab.dataset.mode;
      document.getElementById("login-form").classList.toggle("hidden", mode !== "login");
      document.getElementById("signup-form").classList.toggle("hidden", mode !== "signup");
    });
  });

  if (new URLSearchParams(location.search).get("mode") === "signup") {
    document.querySelector('#mode-tabs .studio-tab[data-mode="signup"]').click();
  }

  // Arabic-Indic digits are accepted ("٢٧" -> 27). Same limits as the server: 5 to 100.
  function parseAge(v) {
    const s = String(v || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).trim();
    if (!/^\d{1,3}$/.test(s)) return null;
    const n = Number(s);
    return n >= 5 && n <= 80 ? n : null;
  }
  // shows the age group the server will give this age (child 5-13, adult 14-59, elderly 60-80)
  document.getElementById("s-age").addEventListener("input", () => {
    const n = parseAge(document.getElementById("s-age").value);
    const box = document.getElementById("s-bracket");
    box.innerHTML = n === null ? "" : `<span>الفئة العمرية بتاعتك:</span> <b>${n >= 60 ? "<span>مسن</span>" : n >= 14 ? "<span>بالغ</span>" : "<span>طفل</span>"}</b>`;
  });

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("login-error");
    const btn = document.getElementById("login-btn");
    errorBox.style.display = "none";
    btn.disabled = true; btn.textContent = "جاري الدخول...";
    try {
      await NMTalent.login(document.getElementById("l-email").value, document.getElementById("l-password").value);
      location.href = returnTo;
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
      btn.disabled = false; btn.textContent = "دخول";
    }
  });

  document.getElementById("signup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("signup-error");
    const btn = document.getElementById("signup-btn");
    errorBox.style.display = "none";
    btn.disabled = true; btn.textContent = "جاري الإنشاء...";
    try {
      const age = parseAge(document.getElementById("s-age").value);
      if (age === null) throw new Error("اكتب السن بالأرقام (من 5 لـ 80)");
      await NMTalent.signup(
        document.getElementById("s-name").value,
        document.getElementById("s-email").value,
        document.getElementById("s-password").value,
        document.getElementById("s-gender").value,
        age
      );
      location.href = returnTo;
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
      btn.disabled = false; btn.textContent = "إنشاء الحساب";
    }
  });
  // Back button: the browser can bring this page back exactly as it was left — email and password still typed,
  // the button stuck on "جاري الدخول...". Whenever the page is shown again from history, start clean.
  function freshAfterBack() {
    const nav = (window.performance && performance.getEntriesByType && performance.getEntriesByType("navigation")[0]) || {};
    return nav.type === "back_forward";
  }
  window.addEventListener("pageshow", (e) => {
    if (!(e.persisted || freshAfterBack())) return;
    const clean = () => {
      document.getElementById("login-form").reset();
      document.getElementById("signup-form").reset();
      document.getElementById("s-bracket").innerHTML = "";
      for (const id of ["login-error", "signup-error"]) { const box = document.getElementById(id); if (box) box.style.display = "none"; }
      const l = document.getElementById("login-btn"); l.disabled = false; l.textContent = "دخول";
      const s = document.getElementById("signup-btn"); s.disabled = false; s.textContent = "إنشاء الحساب";
    };
    clean(); setTimeout(clean, 120);
  });
</script>
</body>
</html>
