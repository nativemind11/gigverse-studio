<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابك — Studio</title>
<meta name="description" content="سجّل جملك الصوتية وسلّمها بسهولة · Record and submit voice tasks">
<meta name="theme-color" content="#0B0D10">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Studio">
<meta property="og:locale" content="ar_AR">
<meta property="og:title" content="حسابك — Studio">
<meta property="og:description" content="سجّل جملك الصوتية وسلّمها بسهولة · Record and submit voice tasks">
<meta property="og:url" content="https://gigversestudio.click/talent-login.html">
<meta property="og:image" content="https://gigversestudio.click/assets/og-image.png?v=1">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Studio">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="حسابك — Studio">
<meta name="twitter:description" content="سجّل جملك الصوتية وسلّمها بسهولة · Record and submit voice tasks">
<meta name="twitter:image" content="https://gigversestudio.click/assets/og-image.png?v=1">
<link rel="stylesheet" href="css/studio.css">
<script src="js/config.js"></script>
<script src="js/studio-i18n-dict.js"></script>
<script src="js/studio-i18n.js"></script>
</head>
<body class="studio">

<header class="studio-header">
  <a href="tasks.html" style="text-decoration:none; color:inherit;"><div class="studio-logo"><span class="dot"></span> Studio</div></a>
</header>

<main class="studio-shell">
  <div class="studio-card">
    <div class="studio-tabs" id="mode-tabs">
      <div class="studio-tab active" data-mode="login">عندي حساب</div>
      <div class="studio-tab" data-mode="signup">حساب جديد</div>
    </div>

    <!-- login -->
    <form id="login-form">
      <div class="studio-eyebrow">تسجيل الدخول</div>
      <h1 class="studio-title">أهلاً بيك تاني</h1>
      <div class="studio-field">
        <label for="l-email">البريد الإلكتروني</label>
        <input type="email" id="l-email" required>
      </div>
      <div class="studio-field">
        <label for="l-password">كلمة المرور</label>
        <input type="password" id="l-password" required>
      </div>
      <p class="text-center" style="margin:-4px 0 14px;"><a href="forgot-password.html" style="font-size:0.85rem; color:var(--studio-text-muted);">نسيت كلمة المرور؟</a></p>
      <p class="studio-error" id="login-error"></p>
      <button type="submit" class="studio-btn studio-btn-primary studio-btn-block" id="login-btn">دخول</button>
    </form>

    <!-- signup -->
    <form id="signup-form" class="hidden">
      <div class="studio-eyebrow">حساب جديد</div>
      <h1 class="studio-title">يلا نبدأ</h1>
      <div class="studio-field">
        <label for="s-name">اسمك الحقيقي</label>
        <input type="text" id="s-name" required>
      </div>
      <div class="studio-field">
        <label for="s-email">البريد الإلكتروني</label>
        <input type="email" id="s-email" required>
      </div>
      <div class="studio-field">
        <label for="s-password">كلمة المرور</label>
        <input type="password" id="s-password" minlength="6" required>
      </div>
      <p class="studio-error" id="signup-error"></p>
      <button type="submit" class="studio-btn studio-btn-primary studio-btn-block" id="signup-btn" style="margin-top:12px;">إنشاء الحساب</button>
    </form>
  </div>
</main>

<script src="js/studio-talent.js"></script>
<script>
  const returnTo = new URLSearchParams(location.search).get("return") || "tasks.html";

  document.querySelectorAll("#mode-tabs .studio-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll("#mode-tabs .studio-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      const mode = tab.dataset.mode;
      document.getElementById("login-form").classList.toggle("hidden", mode !== "login");
      document.getElementById("signup-form").classList.toggle("hidden", mode !== "signup");
    });
  });

  if (new URLSearchParams(location.search).get("mode") === "signup") {
    document.querySelector('#mode-tabs .studio-tab[data-mode="signup"]').click();
  }

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("login-error");
    const btn = document.getElementById("login-btn");
    errorBox.style.display = "none";
    btn.disabled = true; btn.textContent = "جاري الدخول...";
    try {
      await NMTalent.login(document.getElementById("l-email").value, document.getElementById("l-password").value);
      location.href = returnTo;
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
      btn.disabled = false; btn.textContent = "دخول";
    }
  });

  document.getElementById("signup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("signup-error");
    const btn = document.getElementById("signup-btn");
    errorBox.style.display = "none";
    btn.disabled = true; btn.textContent = "جاري الإنشاء...";
    try {
      await NMTalent.signup(
        document.getElementById("s-name").value,
        document.getElementById("s-email").value,
        document.getElementById("s-password").value
      );
      location.href = returnTo;
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
      btn.disabled = false; btn.textContent = "إنشاء الحساب";
    }
  });
</script>
</body>
</html>
