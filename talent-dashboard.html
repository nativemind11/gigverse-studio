<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي — Studio</title>
<meta name="description" content="سجّل جملك الصوتية وسلّمها بسهولة · Record and submit voice tasks">
<meta name="theme-color" content="#0B0D10">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Studio">
<meta property="og:locale" content="ar_AR">
<meta property="og:title" content="حسابي — Studio">
<meta property="og:description" content="سجّل جملك الصوتية وسلّمها بسهولة · Record and submit voice tasks">
<meta property="og:url" content="https://gigversestudio.click/talent-dashboard.html">
<meta property="og:image" content="https://gigversestudio.click/assets/og-image.png?v=1">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Studio">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="حسابي — Studio">
<meta name="twitter:description" content="سجّل جملك الصوتية وسلّمها بسهولة · Record and submit voice tasks">
<meta name="twitter:image" content="https://gigversestudio.click/assets/og-image.png?v=1">
<link rel="stylesheet" href="css/studio.css">
<script src="js/config.js"></script>
<script src="js/studio-i18n-dict.js"></script>
<script src="js/studio-i18n.js"></script>
</head>
<body class="studio">

<header class="studio-header">
  <a href="tasks.html" style="text-decoration:none; color:inherit;"><div class="studio-logo"><span class="dot"></span> Studio</div></a>
  <nav>
    <span id="talent-name" style="color:var(--studio-text-muted);"></span>
    <a href="#" id="logout-link" class="studio-btn studio-btn-secondary" style="padding:8px 16px;">خروج</a>
  </nav>
</header>

<main class="studio-shell wide">
  <div class="studio-eyebrow">حسابي</div>
  <h1 class="studio-title">My Tasks</h1>

  <div class="studio-tabs" id="dash-tabs">
    <div class="studio-tab active" data-tab="available">المتاحة <span class="tab-count" id="count-available"></span></div>
    <div class="studio-tab" data-tab="mine">مهامي <span class="tab-count" id="count-mine"></span></div>
    <div class="studio-tab" data-tab="feedback">الفيدباك والريورك <span class="tab-count" id="count-feedback"></span></div>
  </div>

  <!-- 1) available tasks: only what this talent can still start -->
  <section id="tab-available">
    <p class="studio-hint">المهام اللي تقدر تبدأها دلوقتي. المهمة اللي سلّمتها بتختفي من هنا وبتلاقيها في "مهامي".</p>
    <div id="tasks-wrap" class="studio-grid cols-3" style="margin-top:12px;">
      <p class="studio-hint">جاري تحميل المهام...</p>
    </div>
  </section>

  <!-- 2) the talent's own tasks -->
  <section id="tab-mine" class="hidden">
    <div class="studio-card" id="sessions-wrap">
      <p class="studio-hint">جاري التحميل...</p>
    </div>
  </section>

  <!-- 3) feedback from the company + work sent back by QA -->
  <section id="tab-feedback" class="hidden">
    <div id="feedback-wrap"><p class="studio-hint">جاري التحميل...</p></div>
  </section>

  <!-- leader-code picker popup -->
  <div id="picker-overlay" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;">
    <div class="studio-card" style="max-width:420px; width:100%;">
      <h3 style="margin-top:0;">اختار كود الليدر بتاعك</h3>
      <div id="picker-leaders"></div>
      <button class="studio-btn studio-btn-secondary studio-btn-block" style="margin-top:14px;" id="picker-close">إلغاء</button>
    </div>
  </div>
</main>

<script src="js/studio-talent.js"></script>
<script>
  const talent = NMTalent.requireLogin();
  if (talent) document.getElementById("talent-name").textContent = talent.name;

  document.getElementById("logout-link").addEventListener("click", (e) => {
    e.preventDefault();
    NMTalent.logout();
    location.href = "tasks.html";
  });

  const $ = (id) => document.getElementById(id);
  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // ---------------------------------------------------------------- tabs
  const TABS = ["available", "mine", "feedback"];
  function showTab(name) {
    if (!TABS.includes(name)) name = "available";
    TABS.forEach((t) => $("tab-" + t).classList.toggle("hidden", t !== name));
    document.querySelectorAll("#dash-tabs .studio-tab").forEach((el) => el.classList.toggle("active", el.dataset.tab === name));
    history.replaceState(null, "", "#" + name);
  }
  document.querySelectorAll("#dash-tabs .studio-tab").forEach((el) => el.addEventListener("click", () => showTab(el.dataset.tab)));
  function setCount(id, n) { $(id).textContent = n ? `(${n})` : ""; }

  // ---------------------------------------------------------------- 1) available tasks
  const GENDER_WORD = { male: "ولاد", female: "بنات" };
  const BRACKET_WORD = { child: "أطفال", adult: "بالغين", elderly: "كبار السن" };
  function slotsHtml(t) {
    if (!t.limited) return "";
    return `<div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;">` + t.slots.map(s => {
      const full = s.full || s.max === 0;
      const who = `<span>${GENDER_WORD[s.gender]}</span>` + (s.ageBracket ? ` <span>${BRACKET_WORD[s.ageBracket]}</span>` : "");
      return `<span class="studio-pill ${full ? "status-rejected" : "status-approved"}">${who} ${full ? `<span>تم الاكتفاء</span>` : `<span>متبقي</span> <span dir="ltr">${s.remaining} / ${s.max}</span>`}</span>`;
    }).join("") + `</div>`;
  }

  function renderAvailable(tasks) {
    const wrap = $("tasks-wrap");
    setCount("count-available", tasks.length);
    if (!tasks.length) {
      wrap.innerHTML = `<div class="studio-empty"><div class="icon">🎙️</div><p>مفيش مهام متاحة ليك دلوقتي. لما تنزل مهمة جديدة هتظهر هنا.</p></div>`;
      return;
    }
    wrap.innerHTML = tasks.map(t => {
      const allFull = t.limited && t.slots.every(s => s.full || s.max === 0);
      const legacy = !t.limited && t.quantity ? ` • العدد المتاح: ${Math.max(t.quantity - t.submission_count, 0)}` : "";
      return `
      <div class="studio-card">
        <h3 style="margin:4px 0 8px;">${escapeHtml(t.title)}</h3>
        <p class="studio-hint" style="margin-bottom:12px;">${t.sample_count} جملة${legacy}</p>
        ${slotsHtml(t)}
        ${allFull
          ? `<button class="studio-btn studio-btn-secondary studio-btn-block" disabled>تم الاكتفاء</button>`
          : `<button class="studio-btn studio-btn-primary studio-btn-block" onclick="openPicker('${t.id}')">ابدأ التسجيل</button>`}
      </div>`;
    }).join("");
  }

  async function openPicker(taskId) {
    const overlay = $("picker-overlay");
    const leadersBox = $("picker-leaders");
    leadersBox.innerHTML = `<p class="studio-hint">جاري التحميل...</p>`;
    overlay.classList.remove("hidden");
    try {
      const detail = await NMTalent.getTaskDetail(taskId);
      if (detail.task.direct) { goToSetup(taskId, null); return; }      // direct task: no leader to pick
      if (!detail.leaders.length) {
        leadersBox.innerHTML = `<p class="studio-hint mb-0">مفيش أكواد ليدرز متاحة للمهمة دي دلوقتي.</p>`;
        return;
      }
      const leaderFull = (id) => { const ls = detail.leaderSlots && detail.leaderSlots[id]; return !!(ls && ls.limited && ls.slots.every(x => x.max === 0 || x.remaining <= 0)); };
      leadersBox.innerHTML = detail.leaders.map(l => leaderFull(l.id) ? `
        <button type="button" class="studio-btn studio-btn-secondary studio-btn-block" style="margin-bottom:8px; justify-content:flex-start;" disabled>
          <span class="studio-code">${l.leader_code}</span> <small><span>تم الاكتفاء</span></small>
        </button>` : `
        <button type="button" class="studio-btn studio-btn-secondary studio-btn-block" style="margin-bottom:8px; justify-content:flex-start;"
          onclick="goToSetup('${taskId}', '${l.id}')">
          <span class="studio-code">${l.leader_code}</span>
        </button>`).join("");
    } catch (err) {
      leadersBox.innerHTML = `<p class="studio-error" style="display:block;">${escapeHtml(err.message)}</p>`;
    }
  }
  function goToSetup(taskId, leaderId) {
    location.href = `talent-setup.html?taskId=${taskId}` + (leaderId ? `&leaderId=${leaderId}` : "");
  }
  $("picker-close").addEventListener("click", () => $("picker-overlay").classList.add("hidden"));
  window.openPicker = openPicker;
  window.goToSetup = goToSetup;

  // ---------------------------------------------------------------- 2) my tasks
  const STATUS_LABELS = {
    in_progress: "لسه بتسجّل",
    submitted: "اتسلّمت — في انتظار المراجعة",
    reviewing: "بتتراجع دلوقتي",
    approved: "✅ اتقبلت",
    rejected: "❌ محتاجة إعادة",
    expired: "⛔ انتهت مهلة الإعادة — الاسم اتسحب",
  };
  const STATUS_CLASS = { approved: "status-approved", rejected: "status-rejected", expired: "status-rejected", submitted: "status-pending", reviewing: "status-pending" };
  // a session withdrawn for sitting idle (never submitted, so it never had a rework deadline)
  const statusLabel = (s) => (s.status === "expired" && !s.rework_deadline) ? "⛔ اتسحبت — فضلت من غير تسجيل" : (STATUS_LABELS[s.status] || s.status);

  function renderMine(sessions) {
    const wrap = $("sessions-wrap");
    setCount("count-mine", sessions.length);
    if (!sessions.length) {
      wrap.innerHTML = `<div class="studio-empty"><div class="icon">🎙️</div><p>لسه مسجّلتش أي حاجة. افتح تبويب "المتاحة" وابدأ.</p></div>`;
      return;
    }
    wrap.innerHTML = `
      <div class="studio-table-wrap">
        <table class="studio-table">
          <thead><tr><th>المهمة</th><th>الليدر</th><th>الاسم المستعار</th><th>التقدّم</th><th>الحالة</th><th></th></tr></thead>
          <tbody>
            ${sessions.map(s => `
              <tr>
                <td>${escapeHtml(s.task_title)}</td>
                <td><span class="studio-code">${s.leader_code}</span></td>
                <td>${escapeHtml(s.fake_name)}</td>
                <td>${s.recorded_count} / ${s.sample_count}</td>
                <td>
                  <span class="studio-pill ${STATUS_CLASS[s.status] || ""}">${statusLabel(s)}</span>
                  ${s.status === "rejected" ? `<div class="studio-hint" style="margin-top:4px; max-width:260px;">⚠️ ${escapeHtml(s.rejection_reason || "")}</div>` : ""}
                </td>
                <td>
                  ${s.status === "in_progress" ? `<a href="recording.html?session=${s.session_token}" class="studio-btn studio-btn-secondary" style="padding:4px 10px; font-size:0.75rem;">كمّل</a>` : ""}
                  ${s.status === "rejected" ? `<a href="recording.html?session=${s.session_token}" class="studio-btn studio-btn-primary" style="padding:4px 10px; font-size:0.75rem;">🔁 إعادة التسجيل</a>` : ""}
                </td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>`;
  }

  // ---------------------------------------------------------------- 3) feedback + rework
  // Returns how many things are waiting for the talent (rework he can do now).
  function renderFeedback(sessions, items) {
    const wrap = $("feedback-wrap");
    const active = items.filter(i => i.status !== "reworked" && i.status !== "expired");
    const withdrawn = items.filter(i => i.status === "expired" && !i.is_final);
    const finals = items.filter(i => i.is_final);
    // one entry per recording session (not per sheet row): the distinct sentences to redo and the soonest deadline
    const byToken = new Map();
    for (const i of active) {
      let g = byToken.get(i.session_token);
      if (!g) { g = { token: i.session_token, title: i.task_title, numbers: new Set(), deadline: i.rework_deadline, canRework: false }; byToken.set(i.session_token, g); }
      (i.recording_numbers || []).forEach(n => g.numbers.add(n));
      if (i.rework_deadline && (!g.deadline || new Date(i.rework_deadline) < new Date(g.deadline))) g.deadline = i.rework_deadline;
      if (i.session_status === "rejected") g.canRework = true;
    }
    const groups = [...byToken.values()];
    // work QA sent back (not company feedback): a rejected session that has no open company feedback
    const qaBack = sessions.filter(s => s.status === "rejected" && !byToken.has(s.session_token));
    const todo = groups.filter(g => g.canRework).length + qaBack.length;
    setCount("count-feedback", todo);

    const card = (title, bodyHtml, deadline, token) => {
      const t = NMTalent.timeLeft(deadline);
      return `
      <div style="border-top:1px solid var(--studio-border); padding:12px 0; display:flex; gap:12px; justify-content:space-between; align-items:center; flex-wrap:wrap;">
        <div>
          <b>${escapeHtml(title)}</b>
          ${bodyHtml}
          ${deadline ? `<div style="font-weight:700; color:${t.overdue ? "var(--studio-danger)" : "var(--studio-warn)"};">⏰ ${escapeHtml(t.text)}</div>` : ""}
        </div>
        ${token ? `<a href="recording.html?session=${encodeURIComponent(token)}" class="studio-btn studio-btn-primary" style="padding:8px 16px;">🔁 إعادة التسجيل</a>` : ""}
      </div>`;
    };

    const parts = [];
    if (groups.length) {
      parts.push(`
        <div class="studio-card" style="border-color:var(--studio-warn); margin-bottom:16px;">
          <h3 style="margin-top:0;">📩 فيدباك من الشركة على شغلك</h3>
          <p class="studio-hint">الشركة طلبت إعادة تسجيلات معيّنة. سجّلها وسلّمها <b>قبل ما المهلة تخلص</b> — لو خلصت من غير تسليم، الاسم بيتسحب منك ويتاح لحد تاني.</p>
          ${groups.map(g => card(g.title, `<div style="margin:6px 0;"><b>${g.numbers.size}</b> <span>تسجيل محتاج إعادة</span></div>`, g.deadline, g.canRework ? g.token : null)).join("")}
        </div>`);
    }
    if (qaBack.length) {
      parts.push(`
        <div class="studio-card" style="margin-bottom:16px;">
          <h3 style="margin-top:0;">❌ تسليمات محتاجة إعادة (من المراجعة)</h3>
          ${qaBack.map(s => card(s.task_title, `<div class="studio-hint" style="margin:6px 0; max-width:420px;">⚠️ ${escapeHtml(s.rejection_reason || "")}</div>`, s.rework_deadline, s.session_token)).join("")}
        </div>`);
    }
    if (finals.length || withdrawn.length) {
      parts.push(`
        <div class="studio-card" style="margin-bottom:16px;">
          ${finals.map(i => `
            <div style="padding:8px 0; color:var(--studio-danger);">
              🚫 <b>${escapeHtml(i.task_title)}</b> <span>— الشركة رفضت تسجيلات (${(i.recording_numbers || []).join(", ")}) رفضًا نهائيًا ومفيش إعادة مطلوبة منك.</span>${i.issue_description ? ` <span>السبب: ${escapeHtml(i.issue_description)}</span>` : ""}
            </div>`).join("")}
          ${withdrawn.map(i => `
            <div style="padding:8px 0; color:var(--studio-danger);">
              ⛔ <b>${escapeHtml(i.task_title)}</b> — المهلة خلصت واتسحب منك الاسم. لو لسه عايز تشتغل على المهمة دي، ابدأ تسجيل جديد من تبويب "المتاحة".
            </div>`).join("")}
        </div>`);
    }
    wrap.innerHTML = parts.length ? parts.join("") : `<div class="studio-empty"><div class="icon">✅</div><p>مفيش فيدباك ولا ريورك عليك دلوقتي.</p></div>`;
    return todo;
  }

  // ---------------------------------------------------------------- start
  async function init() {
    const [tRes, sRes, fRes] = await Promise.allSettled([NMTalent.getTasks(), NMTalent.getMySessions(), NMTalent.getMyFeedback()]);
    if (tRes.status === "fulfilled") renderAvailable(tRes.value);
    else $("tasks-wrap").innerHTML = `<div class="studio-empty"><p>${escapeHtml(tRes.reason.message)}</p></div>`;

    const sessions = sRes.status === "fulfilled" ? sRes.value : [];
    if (sRes.status === "fulfilled") renderMine(sessions);
    else $("sessions-wrap").innerHTML = `<div class="studio-empty"><p>${escapeHtml(sRes.reason.message)}</p></div>`;

    const items = fRes.status === "fulfilled" ? (fRes.value.items || []) : [];
    const todo = renderFeedback(sessions, items);

    const wanted = location.hash.replace("#", "");
    if (TABS.includes(wanted)) showTab(wanted);
    else if (todo > 0) showTab("feedback");
    else if (sessions.some(s => s.status === "in_progress")) showTab("mine");
    else showTab("available");
  }
  if (talent) init();
</script>
</body>
</html>
