<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الهيد ليدر — Studio</title>
<meta name="description" content="سجّل جملك الصوتية وسلّمها بسهولة · Record and submit voice tasks">
<meta name="theme-color" content="#0B0D10">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Studio">
<meta property="og:locale" content="ar_AR">
<meta property="og:title" content="لوحة الهيد ليدر — Studio">
<meta property="og:description" content="سجّل جملك الصوتية وسلّمها بسهولة · Record and submit voice tasks">
<meta property="og:url" content="https://gigversestudio.click/dashboard-head-leader.html">
<meta property="og:image" content="https://gigversestudio.click/assets/og-image.png?v=1">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Studio">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="لوحة الهيد ليدر — Studio">
<meta name="twitter:description" content="سجّل جملك الصوتية وسلّمها بسهولة · Record and submit voice tasks">
<meta name="twitter:image" content="https://gigversestudio.click/assets/og-image.png?v=1">
<link rel="stylesheet" href="css/studio.css">
<script src="js/studio-i18n-dict.js"></script>
<script src="js/studio-i18n.js"></script>
</head>
<body class="studio">

<header class="studio-header">
  <div class="studio-logo"><span class="dot"></span> Studio</div>
  <nav>
    <span id="hl-name" style="color:var(--studio-text-muted);"></span>
    <a href="#" id="logout-link" class="studio-btn studio-btn-secondary" style="padding:8px 16px;">خروج</a>
  </nav>
</header>

<main class="studio-shell wide">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:12px;">
    <div>
      <div class="studio-eyebrow">لوحة الهيد ليدر</div>
      <h1 class="studio-title" style="margin:0;">كل المهام المنشورة</h1>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <a href="delivery.html" class="studio-btn studio-btn-secondary">📦 التسليم للشركة</a>
      <a href="feedback.html" class="studio-btn studio-btn-secondary">📝 فيدباك الشركة</a>
      <a href="publish-task.html" class="studio-btn studio-btn-primary">+ نشر مهمة جديدة</a>
    </div>
  </div>

  <div id="share-links"></div>

  <div class="studio-card" id="tasks-wrap">
    <div class="studio-empty"><p>جاري التحميل...</p></div>
  </div>

  <div class="studio-card" style="margin-top:18px;">
    <h3 style="margin-top:0;">مراجعي QA</h3>
    <p class="studio-subtitle">اعمل حساب لأي حد عايزه يراجع التسليمات. مفيش تسجيل عام لحسابات الـ QA — إنت اللي بتعملهم.</p>

    <div class="studio-grid cols-3" style="align-items:end;">
      <div class="studio-field">
        <label for="qa-name">الاسم</label>
        <input type="text" id="qa-name">
      </div>
      <div class="studio-field">
        <label for="qa-email">الإيميل</label>
        <input type="email" id="qa-email">
      </div>
      <div class="studio-field">
        <label for="qa-password">كلمة المرور</label>
        <input type="password" id="qa-password" minlength="6">
      </div>
    </div>
    <p class="studio-error" id="qa-create-error"></p>
    <p class="studio-success" id="qa-create-success"></p>
    <button class="studio-btn studio-btn-primary" id="qa-create-btn">+ إضافة مراجع QA</button>

    <div id="qa-reviewers-list" style="margin-top:18px;"></div>
  </div>
</main>

<script src="js/studio-shared.js"></script>
<script src="js/studio-share.js"></script>
<script>
  const user = NMStudio.requireStudioRole("head_leader");
  if (user) document.getElementById("hl-name").textContent = user.name;
  if (user) StudioShare.mount("share-links");
  document.getElementById("logout-link").addEventListener("click", (e) => {
    e.preventDefault();
    NMStudio.logout();
    location.href = "login.html";
  });

  const STATUS_LABELS = { draft: "مسودة", published: "منشورة", closed: "مقفولة" };

  async function loadTasks() {
    const wrap = document.getElementById("tasks-wrap");
    try {
      const tasks = await NMStudio.apiGetMyTasks();
      if (!tasks.length) {
        wrap.innerHTML = `<div class="studio-empty"><div class="icon">🎙️</div><p>لسه مفيش مهام منشورة. دوس "نشر مهمة جديدة" عشان تبدأ.</p></div>`;
        return;
      }
      wrap.innerHTML = `
        <div class="studio-table-wrap">
          <table class="studio-table">
            <thead><tr><th>المهمة</th><th>الحالة</th><th>الجمل</th><th>الليدرز</th><th>تسليمات</th><th>ذكور معتمدة</th><th>إناث معتمدة</th><th>المساحة</th></tr></thead>
            <tbody>
              ${tasks.map(t => `
                <tr>
                  <td>${escapeHtml(t.title)}</td>
                  <td><span class="studio-pill ${t.status === "published" ? "status-approved" : ""}">${STATUS_LABELS[t.status] || t.status}</span></td>
                  <td>${t.sample_count}</td>
                  <td>${t.leader_count}</td>
                  <td>${t.submission_count}</td>
                  <td>${t.approved_male_count}</td>
                  <td>${t.approved_female_count}</td>
                  <td>${storageCell(t)}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>`;
    } catch (err) {
      wrap.innerHTML = `<div class="studio-empty"><p>${err.message}</p></div>`;
    }
  }

  // ---- "finish the task for good" ---------------------------------------
  function fmtBytes(n) {
    n = Number(n) || 0;
    if (n >= 1073741824) return (n / 1073741824).toFixed(1) + " GB";
    if (n >= 1048576) return (n / 1048576).toFixed(0) + " MB";
    return Math.max(1, Math.round(n / 1024)) + " KB";
  }
  function storageCell(t) {
    if (t.storage_cleared_at) {
      return `<span class="studio-pill status-approved">✅ اتفضّت</span>${Number(t.storage_freed_bytes) ? `<div class="studio-hint">${fmtBytes(t.storage_freed_bytes)}</div>` : ""}`;
    }
    if (t.status === "draft") return `<span class="studio-hint">—</span>`;
    return `<button type="button" class="studio-btn studio-btn-secondary" style="padding:6px 12px; font-size:0.8rem; white-space:nowrap;" data-finalize="${t.id}" data-title="${escapeHtml(t.title)}">🧹 إنهاء نهائي</button>`;
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest && e.target.closest("button[data-finalize]");
    if (b) openFinalize(b.dataset.finalize, b.dataset.title);
  });

  function closeFinalize() { const o = document.getElementById("finalize-overlay"); if (o) o.remove(); }
  function showFinalize(html) {
    let o = document.getElementById("finalize-overlay");
    if (!o) {
      o = document.createElement("div");
      o.id = "finalize-overlay";
      o.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center; padding:20px; z-index:80;";
      document.body.appendChild(o);
    }
    o.innerHTML = `<div class="studio-card" style="max-width:480px; width:100%; max-height:90vh; overflow:auto; margin:0;">${html}</div>`;
    return o;
  }

  async function openFinalize(taskId, title) {
    showFinalize(`<h3 style="margin-top:0;">🧹 إنهاء المهمة نهائيًا</h3><p class="studio-hint">جاري الفحص...</p>`);
    try {
      const info = await NMStudio.apiFinalizeInfo(taskId);
      const header = `<h3 style="margin-top:0;">🧹 إنهاء المهمة نهائيًا</h3><p class="studio-subtitle" style="margin-top:-6px;"><strong>${escapeHtml(title)}</strong></p>`;
      if (info.alreadyCleared) {
        showFinalize(header + `<p>المهمة دي اتفضّت قبل كده.</p><button class="studio-btn studio-btn-secondary studio-btn-block" id="fin-close">إغلاق</button>`);
        document.getElementById("fin-close").onclick = closeFinalize;
        return;
      }
      if (info.blockers.length) {
        showFinalize(header +
          `<p>المهمة لسه مش جاهزة، لازم الأول:</p>
           <ul style="padding-inline-start:20px; line-height:1.9;">${info.blockers.map(b => `<li class="studio-error" style="display:list-item; background:none; border:none; padding:0;">${escapeHtml(b.message)}</li>`).join("")}</ul>
           <button class="studio-btn studio-btn-secondary studio-btn-block" id="fin-close">إغلاق</button>`);
        document.getElementById("fin-close").onclick = closeFinalize;
        return;
      }
      showFinalize(header +
        `<p>هيتمسح كل ملفات الصوت والـ ZIP بتاعة المهمة دي من التخزين نهائيًا، والمساحة هترجع فاضية.</p>
         <p class="studio-hint">اللي هيفضل: أسماء الجمل والأرقام والحالات وملفات الإكسل. اللي هيتمسح: التسجيلات نفسها.</p>
         ${info.warnings.map(w => `<p class="studio-hint" style="color:var(--studio-warn);">⚠️ ${escapeHtml(w.message)}</p>`).join("")}
         <p style="color:var(--studio-danger); font-weight:700;">ده نهائي ومفيش رجوع منه.</p>
         <label style="display:flex; gap:10px; align-items:flex-start; margin:14px 0; cursor:pointer;">
           <input type="checkbox" id="fin-ok" style="margin-top:4px;">
           <span>أنا شايف إن المهمة خلصت تمامًا (الفيدباك خلص، والملفات اتحمّلت عندي).</span>
         </label>
         <p class="studio-error" id="fin-error"></p>
         <div style="display:flex; gap:10px;">
           <button class="studio-btn studio-btn-secondary studio-btn-block" id="fin-cancel">إلغاء</button>
           <button class="studio-btn studio-btn-danger studio-btn-block" id="fin-go" disabled>امسح وفضّي المساحة</button>
         </div>`);
      const ok = document.getElementById("fin-ok"), go = document.getElementById("fin-go");
      ok.onchange = () => { go.disabled = !ok.checked; };
      document.getElementById("fin-cancel").onclick = closeFinalize;
      go.onclick = () => runFinalize(taskId, title);
    } catch (err) {
      showFinalize(`<h3 style="margin-top:0;">🧹 إنهاء المهمة نهائيًا</h3><p class="studio-error" style="display:block;">${escapeHtml(err.message)}</p><button class="studio-btn studio-btn-secondary studio-btn-block" id="fin-close">إغلاق</button>`);
      document.getElementById("fin-close").onclick = closeFinalize;
    }
  }

  async function runFinalize(taskId, title) {
    let freed = 0;
    showFinalize(`<h3 style="margin-top:0;">🧹 جاري التفضية...</h3><p class="studio-hint">متقفلش الصفحة. ممكن ياخد من ثواني لدقايق على حسب حجم الملفات.</p>`);
    try {
      for (let i = 0; i < 40; i++) {
        const r = await NMStudio.apiFinalizeRun(taskId);
        freed += Number(r.freedBytes) || 0;
        if (r.done) {
          showFinalize(`<h3 style="margin-top:0;">✅ المهمة اتفضّت</h3>
            <p>اتمسحت كل ملفات ${escapeHtml(title)} من التخزين.</p>
            ${freed > 0 ? `<p class="studio-hint">المساحة اللي اتفضّت: ${fmtBytes(freed)}</p>` : ""}
            <button class="studio-btn studio-btn-primary studio-btn-block" id="fin-close">تمام</button>`);
          document.getElementById("fin-close").onclick = closeFinalize;
          loadTasks();
          return;
        }
      }
      throw new Error("العملية لسه مكمّلتش — دوس على الزرار تاني عشان تكمّل من مكان ما وقفت.");
    } catch (err) {
      showFinalize(`<h3 style="margin-top:0;">⚠️ مكمّلتش</h3><p class="studio-error" style="display:block;">${escapeHtml(err.message)}</p>
        <p class="studio-hint">اللي اتمسح فعلاً مش هيتأثر، وتقدر تدوس "إنهاء نهائي" تاني تكمّل.</p>
        <button class="studio-btn studio-btn-secondary studio-btn-block" id="fin-close">إغلاق</button>`);
      document.getElementById("fin-close").onclick = closeFinalize;
      loadTasks();
    }
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  loadTasks();

  async function loadQaReviewers() {
    const wrap = document.getElementById("qa-reviewers-list");
    try {
      const reviewers = await NMStudio.apiGetQaReviewers();
      wrap.innerHTML = reviewers.length
        ? `<div class="studio-table-wrap"><table class="studio-table">
            <thead><tr><th>الاسم</th><th>الإيميل</th></tr></thead>
            <tbody>${reviewers.map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.email)}</td></tr>`).join("")}</tbody>
          </table></div>`
        : `<p class="studio-hint mb-0">لسه معملتش أي حساب مراجع.</p>`;
    } catch (err) {
      wrap.innerHTML = `<p class="studio-error" style="display:block;">${err.message}</p>`;
    }
  }
  loadQaReviewers();

  document.getElementById("qa-create-btn").addEventListener("click", async () => {
    const errorBox = document.getElementById("qa-create-error");
    const successBox = document.getElementById("qa-create-success");
    errorBox.style.display = "none"; successBox.style.display = "none";
    const name = document.getElementById("qa-name").value.trim();
    const email = document.getElementById("qa-email").value.trim();
    const password = document.getElementById("qa-password").value;
    if (!name || !email || !password) {
      errorBox.textContent = "املا كل الحقول.";
      errorBox.style.display = "block";
      return;
    }
    const btn = document.getElementById("qa-create-btn");
    btn.disabled = true; btn.textContent = "جاري الإضافة...";
    try {
      await NMStudio.apiCreateQaReviewer({ name, email, password });
      successBox.textContent = "✓ اتعمل الحساب بنجاح";
      successBox.style.display = "block";
      document.getElementById("qa-name").value = "";
      document.getElementById("qa-email").value = "";
      document.getElementById("qa-password").value = "";
      loadQaReviewers();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
    } finally {
      btn.disabled = false; btn.textContent = "+ إضافة مراجع QA";
    }
  });
</script>
</body>
</html>
